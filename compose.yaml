name: clinfusion

x-build: &clinfusion-build
  context: .
  args:
    ROCM_IMAGE: ${ROCM_IMAGE:-rocm/pytorch:rocm7.2.1_ubuntu24.04_py3.12_pytorch_release_2.9.1}
    CLINFUSION_REF: ${CLINFUSION_REF:-96dd208ea7cdfecd001a703e232aa607802a8fd6}

services:
  api:
    build: *clinfusion-build
    image: clinfusion-strix-halo:local
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 8gb
    ports:
      - "${API_PORT:-8008}:8008"
    volumes:
      - ${HOST_CACHE_DIR:-./cache}:/opt/ClinFusion/cache
      - ${HOST_DATA_DIR:-./data}:/data
    environment:
      MODEL_AUTOLOAD: ${MODEL_AUTOLOAD:-1}
      MODEL_VARIANT: ${MODEL_VARIANT:-8B}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEFAULT_MAX_NEW_TOKENS: ${DEFAULT_MAX_NEW_TOKENS:-128}
      MAX_NEW_TOKENS_LIMIT: ${MAX_NEW_TOKENS_LIMIT:-4096}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      MAX_IMAGES: ${MAX_IMAGES:-10}
      CLINFUSION_DTYPE: ${CLINFUSION_DTYPE:-fp16}
      CLINFUSION_ATTN_IMPL: ${CLINFUSION_ATTN_IMPL:-sdpa}
      CLINFUSION_STRICT_3D: ${CLINFUSION_STRICT_3D:-1}
      ATTENTION_BACKEND: ${ATTENTION_BACKEND:-TORCH_SDPA}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-60}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  setup:
    build: *clinfusion-build
    image: clinfusion-strix-halo:local
    profiles: ["tools"]
    volumes:
      - ${HOST_CACHE_DIR:-./cache}:/opt/ClinFusion/cache
    environment:
      MODEL_VARIANT: ${MODEL_VARIANT:-8B}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-60}
    entrypoint: ["python", "/app/scripts/model_manager.py"]
    command: ["check"]
